[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-camera"
version = "0.1.0"
description = "Camera module that finds leftover ink on a whiteboard"
requires-python = ">=3.10"
dependencies = ["opencv-python", "numpy", "pyyaml"]

[tool.setuptools]
packages = ["whiteboard_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
